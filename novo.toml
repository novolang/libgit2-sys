[package]
name        = "libgit2-sys"
version     = "0.1.1"
description = "Bindings over libgit2: the repository, the references, the object identifiers, the commits, the trees, the blobs, the revision walk and the error reporting, one declaration per C entry point."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used
# the package yet, and the tests exercise the entry points rather than
# a consumer's use of them.
stability   = "experimental"

# `sys`: the layer for a package that binds one C library and decides
# nothing of its own.  Every `pub fn` below is an `@ffi` declaration of
# a function in libgit2.
layer       = "sys"

category    = "bindings"

# The one C library.  `libgit2.so` is what the loader resolves these
# symbols against.  Installing this package does not install it.
wraps       = "libgit2"

tags        = ["ffi", "libgit2", "version-control", "object-store", "bindings"]
repository  = "https://github.com/novolang/libgit2-sys"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

[docs.pages]
"README.md" = "The C entry points of libgit2, one novo-lang declaration each"

[dependencies]
# None.  A binding over one C library depends on no novo-lang package.

# The link flag for the `library = "git2"` name every declaration in
# `src/` carries.  On Debian and Ubuntu the system package `libgit2-dev`
# installs `/usr/lib/<arch>/pkgconfig/libgit2.pc`, so pkg-config answers
# `-lgit2`.  That answer also names the transport and compression
# libraries libgit2 was built against.
[ffi.git2]
pkg_config = "libgit2"
